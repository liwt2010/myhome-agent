[project]
name = "myhome-agent"
version = "0.1.0"
description = "家庭私人管家：家庭自动化 + AI 助手，跨生态（米家/涂鸦/Hue 等），本地优先 + 可云端"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",            # v2.19: DeepSeek 走 OpenAI 兼容协议
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-miio>=0.5.12",
    "micloud>=0.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # v0.3 视觉管线
    "ultralytics>=8.0.0",        # YOLO-nano / YOLO-pose
    "opencv-python>=4.8.0",      # RTSP 拉流 + 图像处理
    "numpy>=1.24.0",             # 数组操作
    "cryptography>=42.0.0",      # rtsp_url 凭证加密
    "Pillow>=10.0.0",            # 截图保存
    "PyJWT>=2.8.0",              # 2FA 会话 token
    "pyotp>=2.9.0",              # TOTP 2FA
    "bcrypt>=4.1.0",             # 2FA 备用码散列
    "webauthn>=2.0.0",           # WebAuthn/FIDO2
    "python-telegram-bot>=21.0", # Telegram 通道
    "phe>=1.5.0",                # Paillier 同态加密
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["myhome_agent*"]

[project.scripts]
myhome-agent = "myhome_agent.__main__:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
