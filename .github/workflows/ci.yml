name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.115" "uvicorn[standard]>=0.30" "pydantic>=2.7" \
            "pyyaml>=6.0" "python-dotenv>=1.0" "PyJWT>=2.8" "pyotp>=2.9" "bcrypt>=4.1" \
            "webauthn>=2" "python-telegram-bot>=21" "httpx>=0.27" "pytest>=8" \
            "cryptography>=42" "phe>=1.5" "opencv-python-headless>=4.8" "numpy>=1.24" \
            "Pillow>=10" "openai>=1.50"
      - name: Run tests
        run: python -m pytest
